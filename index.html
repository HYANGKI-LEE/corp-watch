<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corp Watch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Corp Watch</h1>
    <p class="sub">개별 기업 최근 실적·주요 재무지표 <span id="updated"></span></p>
  </header>

  <section class="controls">
    <select id="company" aria-label="기업"></select>
    <div class="chips" id="basis" aria-label="연결/별도">
      <button data-v="C">연결</button>
      <button data-v="S">별도</button>
    </div>
    <div class="chips" id="freq" aria-label="주기">
      <button data-v="Q">분기</button>
      <button data-v="A">연간</button>
    </div>
    <div class="chips" id="range" aria-label="기간">
      <button data-v="3">3년</button>
      <button data-v="5" class="on">5년</button>
      <button data-v="10">10년</button>
      <button data-v="0">전체</button>
    </div>
  </section>
  <p id="status" class="muted note"></p>

  <section id="kpis" class="kpis"></section>

  <nav class="tabs" id="tabs">
    <button data-tab="수익성" class="on">수익성</button>
    <button data-tab="레버리지">레버리지</button>
    <button data-tab="유동성">유동성</button>
    <button data-tab="현금흐름">현금흐름</button>
    <button data-tab="표">지표 표</button>
  </nav>

  <section id="charts" class="grid"></section>

  <section id="tablebox" hidden>
    <div class="tablewrap" id="tablewrap">
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>
    <h3>데이터 출처 (선택한 기간에 실제로 쓴 DataGuide 항목)</h3>
    <div class="tablewrap"><table id="srctbl"><thead></thead><tbody></tbody></table></div>
  </section>

  <p class="muted note foot">
    단위: 억원 · 4분기 누적 = 최근 4개 분기 합(손익·현금흐름) 또는 평균 잔액(재무상태표) · 3년 누적 = 최근 12개 분기 ·
    <b>잠정</b> = 잠정실적 공시만 있고 재무상태표가 없는 분기 · 점선 = 기준선 · 출처: FnGuide DataGuide
  </p>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
